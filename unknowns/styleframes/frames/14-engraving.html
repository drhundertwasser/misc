<!doctype html><html><head><meta charset="utf-8"><title>14 Victorian engraving</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:#e9dcc0}svg{display:block}</style></head><body>
<svg viewBox="0 0 1600 900" width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
<defs>
 <radialGradient id="age" cx=".5" cy=".5" r=".8"><stop offset="0" stop-color="#efe4c9"/><stop offset="1" stop-color="#cdb98f"/></radialGradient>

 <pattern id="h1" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 3.5 H7" stroke="#3b2a1a" stroke-width=".9"/></pattern>
 <pattern id="h2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 3 H6" stroke="#3b2a1a" stroke-width="1.1"/></pattern>
 <pattern id="hx" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 3 H6 M3 0 V6" stroke="#3b2a1a" stroke-width="1"/></pattern>
 <pattern id="hh" width="100" height="6" patternUnits="userSpaceOnUse"><path d="M0 3 H100" stroke="#3b2a1a" stroke-width=".8"/></pattern>
 <pattern id="sky" width="100" height="9" patternUnits="userSpaceOnUse"><path d="M0 4.5 H100" stroke="#3b2a1a" stroke-width=".6" opacity=".7"/></pattern>
 <pattern id="sea" width="60" height="10" patternUnits="userSpaceOnUse"><path d="M0 5 q15 -5 30 0 t30 0" fill="none" stroke="#3b2a1a" stroke-width="1"/></pattern>
 <pattern id="stip" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".9" fill="#3b2a1a"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#age)"/>
<!-- ornamental frame -->
<rect x="40" y="40" width="1520" height="820" fill="none" stroke="#3b2a1a" stroke-width="3"/>
<rect x="52" y="52" width="1496" height="796" fill="none" stroke="#3b2a1a" stroke-width="1"/>
<g fill="none" stroke="#3b2a1a" stroke-width="1.5">
 <path d="M52 110 q30 -30 0 -58 M110 52 q-30 30 -58 0 M1548 110 q-30 -30 0 -58 M1490 52 q30 30 58 0 M52 790 q30 30 0 58 M110 848 q-30 -30 -58 0 M1548 790 q-30 30 0 58 M1490 848 q30 -30 58 0"/>
</g>
<!-- picture plate -->
<g clip-path="url(#plate)">
 <clipPath id="plate"><rect x="90" y="90" width="1000" height="600"/></clipPath>
 <rect x="90" y="90" width="1000" height="600" fill="url(#sky)"/>
 <rect x="90" y="90" width="1000" height="140" fill="url(#hh)" opacity=".5"/>
 <!-- distant sea -->
 <rect x="90" y="330" width="1000" height="120" fill="url(#sea)"/>
 <rect x="90" y="330" width="1000" height="40" fill="url(#hh)" opacity=".4"/>
 <!-- distant ship with bird-head prow -->
 <g fill="none" stroke="#3b2a1a" stroke-width="2">
  <path d="M700 360 C720 385 820 385 840 360 L860 335 C850 340 845 350 840 360 M700 360 C690 345 685 335 690 325 C695 330 700 338 705 345 M770 360 L770 300 M740 300 L800 300 M770 300 L772 290"/>
  <path d="M745 320 q25 -15 50 0 M745 335 q25 -15 50 0" stroke-width="1.5"/>
 </g>
 <!-- shore -->
 <path d="M90 450 L1090 450 L1090 690 L90 690Z" fill="url(#h1)"/>
 <path d="M90 450 Q400 470 700 455 T1090 470 L1090 690 L90 690Z" fill="url(#stip)"/>
 <!-- relief slab -->
 <g transform="translate(560 200)">
  <path d="M0 0 L420 -20 L430 420 L10 440Z" fill="#e9dcc0" stroke="#3b2a1a" stroke-width="3"/>
  <path d="M0 0 L420 -20 L430 420 L10 440Z" fill="url(#stip)" opacity=".5"/>
  <path d="M430 420 L460 400 L450 -40 L420 -20" fill="url(#hx)" stroke="#3b2a1a" stroke-width="2"/>
  <!-- carved scene: two warriors with feathered headdress, a ship -->
  <g fill="none" stroke="#3b2a1a" stroke-width="2.5" stroke-linecap="round">
   <!-- warrior 1 -->
   <circle cx="110" cy="100" r="22"/><path d="M90 85 l-8 -30 M100 80 l-4 -34 M110 78 l0 -36 M120 80 l4 -34 M130 85 l8 -30" stroke-width="2"/>
   <path d="M110 122 L110 220 M110 150 L70 190 M110 150 L150 180 M110 220 L90 300 M110 220 L132 300"/>
   <path d="M150 180 l20 -60" /><circle cx="68" cy="196" r="22" fill="url(#h1)"/>
   <!-- warrior 2 -->
   <circle cx="260" cy="110" r="22"/><path d="M240 95 l-8 -30 M250 90 l-4 -34 M260 88 l0 -36 M270 90 l4 -34 M280 95 l8 -30" stroke-width="2"/>
   <path d="M260 132 L260 230 M260 160 L300 140 M260 160 L220 200 M260 230 L240 310 M260 230 L282 310"/>
   <path d="M300 140 l40 -50 l-6 20" />
   <!-- carved ship at bottom -->
   <path d="M60 390 C90 420 320 420 360 390 L390 350 M60 390 C45 370 50 350 60 340 M200 390 L200 330 M160 330 L240 330"/>
   <path d="M170 350 q30 -14 60 0 M170 368 q30 -14 60 0" stroke-width="1.8"/>
  </g>
 </g>
 <!-- archaeologist, standing left, with lantern and notebook -->
 <g transform="translate(250 230)" fill="none" stroke="#3b2a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- long coat -->
  <path d="M60 110 C80 90 140 90 160 110 L200 420 L20 420Z" fill="url(#h1)"/>
  <path d="M60 110 C80 90 140 90 160 110 L200 420 L20 420Z"/>
  <path d="M110 110 L110 420" stroke-width="1.5"/>
  <path d="M90 120 L110 150 L130 120" stroke-width="2"/>
  <!-- head, grey bun, spectacles -->
  <circle cx="110" cy="60" r="38" fill="#e9dcc0"/>
  <path d="M74 50 C80 10 140 10 146 50 C130 36 90 36 74 50Z" fill="url(#h2)"/>
  <circle cx="72" cy="30" r="14" fill="url(#h2)"/>
  <path d="M92 60 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0 M114 60 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0 M110 60 L114 60" stroke-width="1.8"/>
  <path d="M100 80 q12 8 24 0" stroke-width="1.6"/>
  <!-- cheeks hatch -->
  <path d="M82 70 q10 -6 18 2" stroke-width="1" opacity=".6"/>
  <!-- arm with lantern raised toward slab -->
  <path d="M160 130 L230 100 L300 120" stroke-width="12"/>
  <path d="M160 130 L230 100 L300 120" stroke="#e9dcc0" stroke-width="7"/>
  <path d="M300 120 L300 150 M280 150 L320 150 L326 220 L274 220Z" fill="#e9dcc0"/>
  <path d="M290 160 L310 160 L312 210 L288 210Z" fill="url(#h1)"/>
  <path d="M296 175 q4 -12 8 0 q4 12 -8 10z" fill="#e9dcc0" stroke-width="1"/>
  <!-- other arm with notebook -->
  <path d="M60 130 L30 220 L70 240" stroke-width="12"/>
  <path d="M60 130 L30 220 L70 240" stroke="#e9dcc0" stroke-width="7"/>
  <path d="M50 230 L110 215 L118 265 L58 280Z" fill="#e9dcc0"/><path d="M60 245 L105 234 M62 258 L108 247" stroke-width="1.2"/>
  <!-- feet -->
  <path d="M40 420 L30 440 L80 440 M180 420 L190 440 L140 440"/>
 </g>
 <!-- lantern light rays, engraved -->
 <g stroke="#3b2a1a" stroke-width=".8" opacity=".6"><path d="M560 350 L610 240 M560 360 L640 250 M560 372 L670 262 M560 384 L690 282"/></g>
 <!-- foreground pebbles -->
 <g fill="none" stroke="#3b2a1a" stroke-width="1.5"><ellipse cx="200" cy="660" rx="22" ry="9"/><ellipse cx="900" cy="668" rx="30" ry="11"/><ellipse cx="1000" cy="640" rx="16" ry="7"/></g>
 <rect x="90" y="90" width="1000" height="600" fill="none" stroke="#3b2a1a" stroke-width="2.5"/>
</g>
<!-- caption column -->
<g font-family="IM Fell English" fill="#3b2a1a">
 <text x="1140" y="150" font-family="IM Fell English SC" font-size="26" letter-spacing="3">Plate LXXXVIII.</text>
 <path d="M1140 170 H1500" stroke="#3b2a1a" stroke-width="1"/>
 <text x="1140" y="240" font-style="italic" font-size="40"><tspan x="1140">Who were the</tspan><tspan x="1140" dy="48">Sea Peoples of the</tspan><tspan x="1140" dy="48">Eastern Mediterranean,</tspan><tspan x="1140" dy="48">and what was their</tspan><tspan x="1140" dy="48">role in the collapse of</tspan><tspan x="1140" dy="48">the late Bronze Age?</tspan></text>
 <path d="M1140 560 H1500" stroke="#3b2a1a" stroke-width="1"/>
 <text x="1140" y="600" font-size="22">An Enquiry by</text>
 <text x="1140" y="636" font-family="IM Fell English SC" font-size="28">Eric H. Cline,</text>
 <text x="1140" y="668" font-size="22" font-style="italic">Archaeologist, George Washington University.</text>
 <text x="590" y="760" text-anchor="middle" font-size="22" font-style="italic">Fig. 88. — The Enquirer before the Relief of the Northern Invaders, c. 1177 B.C.</text>
 <text x="800" y="830" text-anchor="middle" font-family="IM Fell English SC" font-size="18" letter-spacing="4">Unknowns · No. 88 of 100</text>
</g>
<rect width="1600" height="900" filter="url(#fox)"/>
</svg></body></html>
