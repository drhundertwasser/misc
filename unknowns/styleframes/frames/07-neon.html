<!doctype html><html><head><meta charset="utf-8"><title>07 Neon synthwave</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Audiowide&display=swap" rel="stylesheet">
<style>html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:#090014}svg{display:block}</style></head><body>
<svg viewBox="0 0 1600 900" width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05000f"/><stop offset=".6" stop-color="#1b0636"/><stop offset="1" stop-color="#3a0a5e"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0433"/><stop offset="1" stop-color="#05000f"/></linearGradient>
 <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#ffb3f0"/><stop offset=".6" stop-color="#ff2bd6" stop-opacity=".6"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".18"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<rect y="560" width="1600" height="340" fill="url(#floor)"/>
<!-- stars -->
<g fill="#fff" opacity=".8"><circle cx="120" cy="80" r="2"/><circle cx="300" cy="200" r="1.5"/><circle cx="1400" cy="90" r="2"/><circle cx="1500" cy="300" r="1.5"/><circle cx="1250" cy="40" r="1.5"/><circle cx="200" cy="420" r="1.5"/><circle cx="1350" cy="480" r="2"/><circle cx="980" cy="60" r="1.5"/></g>
<!-- galaxy -->
<g transform="translate(800 330) rotate(-12)" filter="url(#glowBig)">
 <ellipse rx="290" ry="80" fill="#ff2bd6" opacity=".18"/>
 <ellipse rx="230" ry="60" fill="#ff2bd6" opacity=".25"/>
 <path d="M-260 10 C-200 -70 -60 -90 0 -30 C60 30 200 50 270 -20" fill="none" stroke="#ff7ae6" stroke-width="5" opacity=".9"/>
 <path d="M260 -10 C200 70 60 90 0 30 C-60 -30 -200 -50 -270 20" fill="none" stroke="#ff7ae6" stroke-width="5" opacity=".9"/>
 <circle r="90" fill="url(#core)"/>
</g>
<!-- invisible halo -->
<g filter="url(#glow)"><circle cx="800" cy="330" r="310" fill="none" stroke="#b58cff" stroke-width="3" stroke-dasharray="18 14"/></g>
<text x="1120" y="110" font-family="Audiowide" font-size="20" fill="#b58cff" filter="url(#glow)">DARK MATTER HALO</text>
<text x="1120" y="140" font-family="Audiowide" font-size="16" fill="#b58cff" opacity=".8">inferred · never seen · 85% of all matter</text>
<path d="M1110 120 L1060 190" stroke="#b58cff" stroke-width="2" opacity=".8"/>
<!-- perspective grid -->
<g stroke="#19e6ff" stroke-width="2" filter="url(#glow)" opacity=".9">
 <line x1="0" y1="560" x2="1600" y2="560"/>
 <g id="h"><line x1="0" y1="572" x2="1600" y2="572"/><line x1="0" y1="590" x2="1600" y2="590"/><line x1="0" y1="616" x2="1600" y2="616"/><line x1="0" y1="652" x2="1600" y2="652"/><line x1="0" y1="702" x2="1600" y2="702"/><line x1="0" y1="770" x2="1600" y2="770"/><line x1="0" y1="860" x2="1600" y2="860"/></g>
 <g><line x1="800" y1="560" x2="800" y2="900"/><line x1="800" y1="560" x2="600" y2="900"/><line x1="800" y1="560" x2="400" y2="900"/><line x1="800" y1="560" x2="100" y2="900"/><line x1="800" y1="560" x2="-300" y2="900"/><line x1="800" y1="560" x2="1000" y2="900"/><line x1="800" y1="560" x2="1200" y2="900"/><line x1="800" y1="560" x2="1500" y2="900"/><line x1="800" y1="560" x2="1900" y2="900"/><line x1="800" y1="560" x2="-800" y2="900"/><line x1="800" y1="560" x2="2400" y2="900"/></g>
</g>
<!-- rotation curve graph -->
<g transform="translate(1180 640)" font-family="Audiowide" font-size="13" fill="#19e6ff">
 <rect x="0" y="0" width="330" height="200" fill="#05000f" opacity=".7" stroke="#19e6ff" stroke-width="1.5"/>
 <path d="M30 170 L30 30 M30 170 L310 170" stroke="#19e6ff" stroke-width="1.5" fill="none"/>
 <path d="M40 160 C60 70 90 60 120 90 C170 140 230 155 300 162" stroke="#b58cff" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
 <path d="M40 160 C60 70 90 60 120 70 C180 62 250 62 300 60" stroke="#ff2bd6" stroke-width="3" fill="none" filter="url(#glow)"/>
 <text x="150" y="52" fill="#ff2bd6">OBSERVED</text><text x="200" y="150" fill="#b58cff">EXPECTED</text>
 <text x="36" y="190">radius →</text><text x="12" y="25" transform="rotate(-90 12 25)" text-anchor="end">speed →</text>
</g>
<!-- scientist, back to viewer, holding a tablet -->
<g transform="translate(800 540)">
 <g fill="#05000f" stroke="#19e6ff" stroke-width="4" stroke-linejoin="round" filter="url(#glow)">
  <!-- hijab outline -->
  <path d="M-48 70 C-60 0 -20 -70 0 -70 C20 -70 60 0 48 70 C40 110 -40 110 -48 70Z"/>
  <!-- body -->
  <path d="M-70 110 C-30 90 30 90 70 110 L95 330 L-95 330Z"/>
  <!-- arms holding tablet -->
  <path d="M-70 130 L-110 230 L-60 240 M70 130 L110 230 L60 240"/>
 </g>
 <rect x="-62" y="222" width="124" height="60" rx="6" fill="#19e6ff" opacity=".9" filter="url(#glow)"/>
 <rect x="-50" y="232" width="100" height="40" fill="#05000f"/>
 <path d="M-40 262 C-30 240 -20 238 -10 250 C5 268 20 262 40 245" stroke="#ff2bd6" stroke-width="2.5" fill="none"/>
</g>
<rect width="1600" height="900" fill="url(#scan)"/>
<!-- text -->
<text x="70" y="140" font-family="Orbitron" font-weight="800" font-size="100" fill="#ff2bd6" filter="url(#glow)">40</text>
<text x="70" y="230" font-family="Orbitron" font-weight="600" font-size="60" fill="#fff" filter="url(#glow)">WHAT IS</text>
<text x="70" y="305" font-family="Orbitron" font-weight="800" font-size="70" fill="#19e6ff" filter="url(#glow)">DARK MATTER?</text>
<text x="70" y="360" font-family="Audiowide" font-size="20" fill="#b58cff">INA SARCEVIC · ASTROPHYSICIST · UNIVERSITY OF ARIZONA</text>
</svg></body></html>
