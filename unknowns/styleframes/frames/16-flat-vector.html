<!doctype html><html><head><meta charset="utf-8"><title>16 Flat vector (big-limbed)</title>

 <rect x="-28" y="0" width="56" height="300" rx="28" fill="none" stroke="#bcdcee" stroke-width="4"/>
</g>
<!-- Scientist A: big-limbed, lavender skin, orange parka, pulling the core -->
<g>
 <!-- legs -->

 <circle cx="20" cy="235" r="3" fill="#1f2a44"/><circle cx="40" cy="235" r="3" fill="#1f2a44"/><path d="M20 248 q10 6 20 0" stroke="#1f2a44" stroke-width="4" fill="none"/>
 <!-- arm with flag -->
 <path d="M90 320 C150 300 170 240 170 180" stroke="#1fb7a6" stroke-width="40" fill="none"/>
 <path d="M170 180 L170 20" stroke="#1f2a44" stroke-width="8"/><path d="M174 24 L260 54 L174 84Z" fill="#ff7a45"/>

 <ellipse cx="-80" cy="440" rx="30" ry="24" fill="#e8935a"/>
</g>
<!-- penguin-free, but a gull -->
<path d="M1040 300 q20 -20 40 0 q20 -20 40 0" fill="none" stroke="#1f2a44" stroke-width="6"/>
<!-- text -->
<text x="80" y="130" font-family="Manrope" font-weight="800" font-size="80" fill="#2f6fed">92</text>
<text x="80" y="200" font-family="Manrope" font-weight="800" font-size="40" fill="#1f2a44"><tspan x="80">How sensitive are the world's ice sheets</tspan><tspan x="80" dy="50">to global warming, and what will this</tspan><tspan x="80" dy="50">mean for global sea levels?</tspan></text>
<text x="80" y="360" font-family="Manrope" font-weight="500" font-size="22" fill="#5b6b8c">Sarah Aarons · geochemist · Columbia University</text>
<!-- sea-level label -->
<text x="1050" y="640" font-family="Manrope" font-weight="800" font-size="20" fill="#fff" letter-spacing="2">+ ? m</text>
</svg></body></html>
